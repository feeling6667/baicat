<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} — 画一个故事</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fafafa;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    color: #1a1a1a;
    padding: 20px 0 60px;
  }
  .header {
    text-align: center;
    padding: 40px 20px 30px;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 8px;
    color: #111;
  }
  .header .subtitle {
    margin-top: 10px;
    font-size: 13px;
    color: #999;
    letter-spacing: 2px;
  }
  .panel {
    max-width: 100%;
    margin: 0 auto 24px;
    text-align: center;
  }
  .panel img {
    width: 100%;
    max-width: 420px;
    display: block;
    margin: 0 auto;
    box-shadow: 0 2px 20px rgba(0,0,0,0.08);
  }
  .footer {
    text-align: center;
    margin-top: 40px;
    padding: 30px 20px;
    border-top: 1px solid #eee;
  }
  .footer p {
    font-size: 13px;
    color: #bbb;
    letter-spacing: 1px;
  }
  .footer .tag {
    margin-top: 8px;
    font-size: 12px;
    color: #ccc;
  }
</style>
</head>
<body>

<!-- 
  使用说明（抖音图文模式——文字全部画在图里，HTML 只做纯图片竖排）：
  1. 替换 {{TITLE}} 为故事标题
  2. 复制 .panel 块，每格一个
  3. 替换图片文件名
  4. 图片放在与此 HTML 同一目录下
-->

<div class="header">
  <h1>{{TITLE}}</h1>
  <div class="subtitle">画一个故事</div>
</div>

<!-- Panel template — copy and modify -->
<div class="panel">
  <img src="story_p1.jpeg" alt="panel 1">
</div>

<div class="panel">
  <img src="story_p2.jpeg" alt="panel 2">
</div>

<div class="footer">
  <p>#画一个故事</p>
  <div class="tag">AI 生成 · GPT Image 2</div>
</div>

</body>
</html>
